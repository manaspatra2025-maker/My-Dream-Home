<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Work Console | Pro Attendance</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.freepik.com/512/13390/13390450.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-deep: #030303;
            --surface: #0a0a0a;
            --card-glass: rgba(15, 15, 15, 0.8);
            --primary: #f59e0b; /* Gold */
            --mistri: #f59e0b;
            --labour: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at top right, rgba(245, 158, 11, 0.05), transparent);
            color: var(--text);
            margin: 0; padding: 30px 20px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .wrapper { width: 100%; max-width: 1100px; }

        /* --- Elite Top Bar --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding: 20px 30px;
            background: var(--card-glass); border-radius: 24px; border: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }

        .top-bar-left { display: flex; align-items: center; gap: 15px; }

        .top-bar h1 { font-size: 24px; margin: 0; font-weight: 800; color: #fff; }

        /* --- Go Back Button --- */
        .btn-back {
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--primary); text-decoration: none; transition: 0.3s;
        }
        .btn-back:hover { background: var(--primary); color: #000; transform: translateX(-3px); }

        /* --- Advanced Metrics Board --- */
        .metrics-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px;
        }
        .metric-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 20px; border-radius: 20px; text-align: center;
            transition: 0.3s;
        }
        .metric-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .m-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 8px; }
        .m-val { font-family: 'JetBrains Mono'; font-size: 24px; font-weight: 700; }

        /* --- Interactive Console --- */
        .console-card {
            background: var(--card-glass); border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .input-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 10px; text-transform: uppercase; }
        input {
            width: 100%; background: #141414; border: 1px solid var(--border);
            color: #fff; padding: 14px 18px; border-radius: 12px; font-size: 15px;
        }
        input:focus { border-color: var(--primary); background: #1a1a1a; }

        .btn-sync {
            width: 100%; padding: 18px; background: var(--primary); color: #000;
            font-weight: 800; border: none; border-radius: 16px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .btn-sync:hover { filter: brightness(1.2); transform: scale(1.01); }

        /* --- Advanced Ledger Table --- */
        .ledger-container { border-radius: 24px; border: 1px solid var(--border); background: var(--card-glass); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 20px 25px; text-align: left; font-size: 11px; color: var(--primary); letter-spacing: 1.5px; background: rgba(255,255,255,0.02); }
        td { padding: 18px 25px; border-bottom: 1px solid var(--border); font-size: 14px; }
        
        .chip { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-right: 5px; }
        .chip-m { background: rgba(245, 158, 11, 0.1); color: var(--mistri); border: 1px solid rgba(245, 158, 11, 0.2); }
        .chip-l { background: rgba(59, 130, 246, 0.1); color: var(--labour); border: 1px solid rgba(59, 130, 246, 0.2); }
        
        .delete-btn { color: var(--text-dim); cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { color: var(--danger); }

        .grand-footer {
            padding: 30px; display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border); background: rgba(16, 185, 129, 0.03);
        }

        @media (max-width: 768px) { .input-row, .metrics-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="https://manaspatra2025-maker.github.io/My-Dream-Home/" class="btn-back" title="Go Back">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>Elite Work Console</h1>
        </div>
        <div style="font-size:12px; color:var(--success); font-weight:600;">● Cloud Connected</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card"><span class="m-label">Total Entry</span><span class="m-val" id="mCountEntries">0</span></div>
        <div class="metric-card"><span class="m-label">Total Mistri</span><span class="m-val" id="mSumMistri" style="color:var(--mistri)">0</span></div>
        <div class="metric-card"><span class="m-label">Total Labour</span><span class="m-val" id="mSumLabour" style="color:var(--labour)">0</span></div>
        <div class="metric-card"><span class="m-label">Net Settlement</span><span class="m-val" id="mTotalWage" style="color:var(--success)">₹ 0</span></div>
    </div>

    <div class="console-card">
        <div class="input-row">
            <div><label>Work Date</label><input type="date" id="workDate"></div>
            <div><label>Mistri Count (₹700)</label><input type="number" id="mistriInput" value="0"></div>
            <div><label>Labour Count (₹400)</label><input type="number" id="labourInput" value="0"></div>
        </div>
        <button class="btn-sync" onclick="saveData()">Sync Record To Cloud</button>
    </div>

    <div class="ledger-container">
        <table>
            <thead>
                <tr>
                    <th>DAY</th>
                    <th>DATE REF</th>
                    <th>COMPOSITION</th>
                    <th>SETTLEMENT</th>
                    <th style="width:50px"></th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
        </table>
        <div class="grand-footer">
            <span style="font-size:12px; color:var(--text-dim); font-weight:600;">GRAND TOTAL DISBURSEMENT</span>
            <span id="finalTotalDisplay" style="font-family:'JetBrains Mono'; font-size:28px; font-weight:800; color:var(--primary);">₹ 0</span>
        </div>
    </div>
</div>

<script>
    // Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAAeyg-BywMlATzy-mjri-oPJ0jiWzySsg",
      authDomain: "my-dream-home-2c1bb.firebaseapp.com",
      projectId: "my-dream-home-2c1bb",
      storageBucket: "my-dream-home-2c1bb.firebasestorage.app",
      databaseURL: "https://my-dream-home-2c1bb-default-rtdb.firebaseio.com",
      messagingSenderId: "154400478438",
      appId: "1:154400478438:web:66e870ea75c631cfca5727"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const attendanceRef = db.ref('attendance');

    const M_PRICE = 700;
    const L_PRICE = 400;

    // Save Data
    window.saveData = () => {
        const date = document.getElementById('workDate').value;
        const mistri = parseInt(document.getElementById('mistriInput').value) || 0;
        const labour = parseInt(document.getElementById('labourInput').value) || 0;
        
        if(!date) return alert("Select Date");

        const dailyTotal = (mistri * M_PRICE) + (labour * L_PRICE);
        
        attendanceRef.push({ date, mistri, labour, total: dailyTotal }).then(() => {
            document.getElementById('mistriInput').value = '0';
            document.getElementById('labourInput').value = '0';
        });
    };

    // Load and Calculate Metrics
    function renderAttendance() {
        attendanceRef.on('value', snap => {
            const data = snap.val();
            const tbody = document.getElementById('attendanceTableBody');
            
            // Metric Elements
            const mCount = document.getElementById('mCountEntries');
            const mMistri = document.getElementById('mSumMistri');
            const mLabour = document.getElementById('mSumLabour');
            const mWage = document.getElementById('mTotalWage');
            const mFinalTotal = document.getElementById('finalTotalDisplay');
            
            tbody.innerHTML = '';
            let totalMistri = 0; let totalLabour = 0; let totalWage = 0; let count = 0;

            if(data) {
                const entries = Object.entries(data).reverse();
                count = entries.length;

                entries.forEach(([key, item]) => {
                    const day = new Date(item.date).toLocaleDateString('en-GB', {weekday:'long'});
                    const formattedDate = item.date.split('-').reverse().join(' / ');
                    
                    totalMistri += parseInt(item.mistri || 0);
                    totalLabour += parseInt(item.labour || 0);
                    totalWage += (item.total || 0);

                    tbody.innerHTML += `
                        <tr>
                            <td style="color:var(--primary); font-weight:700; font-size:12px;">${day.toUpperCase()}</td>
                            <td style="font-family:'JetBrains Mono'; color:var(--text-dim)">${formattedDate}</td>
                            <td>
                                <span class="chip chip-m">M: ${item.mistri}</span>
                                <span class="chip chip-l">L: ${item.labour}</span>
                            </td>
                            <td style="font-family:'JetBrains Mono'; font-weight:700;">₹ ${(item.total || 0).toLocaleString()}</td>
                            <td><i class="fa-solid fa-trash-can delete-btn" onclick="deleteEntry('${key}')"></i></td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:60px; color:var(--text-dim);">No Records Synced</td></tr>';
            }

            // Sync Analytics
            mCount.innerText = count;
            mMistri.innerText = totalMistri;
            mLabour.innerText = totalLabour;
            const wageStr = "₹ " + totalWage.toLocaleString();
            mWage.innerText = wageStr;
            mFinalTotal.innerText = wageStr;
        });
    }

    window.deleteEntry = (key) => {
        if(confirm("Permanent Delete?")) attendanceRef.child(key).remove();
    };

    window.onload = () => {
        document.getElementById('workDate').valueAsDate = new Date();
        renderAttendance();
    };
</script>
</body>
</html>
